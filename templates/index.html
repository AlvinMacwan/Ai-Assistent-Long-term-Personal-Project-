<!DOCTYPE html>
<html>
<head>
    <title>RAG Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            color: #222;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }
        .topbar h1 { font-size: 1.3em; margin: 0; }
        .topbar a { color: #2b6cb0; text-decoration: none; font-size: 0.9em; }
        .topbar a:hover { text-decoration: underline; }

        .layout {
            display: flex;
            flex: 1;
            min-height: 0; /* required for children to scroll inside a flex row */
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 240px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
        }
        .new-chat-btn {
            width: 100%;
            margin-bottom: 12px;
        }
        .conv-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .conv-item:hover { background: #f0f0f0; }
        .conv-item.active { background: #e2ecfa; font-weight: 600; }
        .conv-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .conv-delete {
            background: none;
            color: #c0392b;
            padding: 0 4px;
            font-size: 0.9em;
            visibility: hidden;
        }
        .conv-item:hover .conv-delete { visibility: visible; }
        .conv-delete:hover { background: none; text-decoration: underline; }

        /* --- Main panel --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 16px 20px;
            overflow: hidden;
        }
        .card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        h2 { font-size: 1.05em; margin-top: 0; color: #444; }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #2b6cb0;
            color: white;
            cursor: pointer;
            font-size: 0.95em;
        }
        button:hover { background: #245a95; }
        .status { color: #555; font-size: 0.9em; margin-top: 8px; }
        .error { color: #c0392b; font-weight: 500; }

        /* --- Chat log --- */
        .chat-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0;
        }
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .msg {
            margin-bottom: 14px;
            white-space: pre-wrap;
        }
        .msg.user .bubble {
            background: #2b6cb0;
            color: white;
            display: inline-block;
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 80%;
        }
        .msg.user { text-align: right; }
        .msg.assistant .bubble {
            background: #eef5ff;
            border-left: 4px solid #2b6cb0;
            padding: 10px 14px;
            border-radius: 6px;
            display: inline-block;
            max-width: 90%;
            text-align: left;
        }
        .sources-line {
            font-size: 0.85em;
            color: #555;
            margin-top: 6px;
        }
        .sources-line .label { font-weight: 600; color: #2b6cb0; }
        .source-tag {
            display: inline-block;
            background: #e2e8f0;
            border-radius: 4px;
            padding: 2px 8px;
            margin-right: 6px;
            font-family: monospace;
        }
        .input-row {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            border-top: 1px solid #e0e0e0;
        }
        .input-row input[type="text"] { flex: 1; width: auto; }

        .doc-list { margin-top: 12px; font-size: 0.9em; }
        .doc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .doc-row:last-child { border-bottom: none; }
        .delete-btn {
            background: #c0392b;
            padding: 4px 10px;
            font-size: 0.85em;
        }
        .delete-btn:hover { background: #a53125; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>RAG Demo</h1>
        <span>{{ current_user.username }} &middot; <a href="{{ url_for('logout') }}">Logout</a></span>
    </div>

    <div class="layout">
        <div class="sidebar">
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
            <div id="convListContainer"></div>
        </div>

        <div class="main">
            <div class="card">
                <h2>Upload a document</h2>
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.md">
                <button id="uploadBtn">Upload</button>
                <p class="status" id="uploadStatus"></p>
                <div id="docListContainer"></div>
            </div>

            <div class="card chat-card">
                <div class="chat-log" id="chatLog"></div>
                <div class="input-row">
                    <select id="sourceSelect">
                        <option value="">All documents</option>
                    </select>
                    <input type="text" id="questionInput" placeholder="Ask something about the document...">
                    <button id="askBtn">Ask</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadStatus = document.getElementById("uploadStatus");
        const sourceSelect = document.getElementById("sourceSelect");
        const docListContainer = document.getElementById("docListContainer");
        const convListContainer = document.getElementById("convListContainer");
        const chatLog = document.getElementById("chatLog");
        const questionInput = document.getElementById("questionInput");

        // Tracks which conversation is currently open. Every /ask call
        // needs this, since the backend now requires a conversation_id
        // on every request rather than assuming a single fixed one.
        let activeConversationId = null;

        // ================= Documents =================
        async function refreshDocumentList() {
            const response = await fetch("/documents");
            const data = await response.json();

            sourceSelect.innerHTML = '<option value="">All documents</option>';

            let docListHtml = "";
            data.documents.forEach((doc) => {
                const option = document.createElement("option");
                option.value = doc;
                option.textContent = doc;
                sourceSelect.appendChild(option);

                docListHtml += `
                    <div class="doc-row">
                        <span>${doc}</span>
                        <button class="delete-btn" data-filename="${doc}">Delete</button>
                    </div>`;
            });

            docListContainer.innerHTML = data.documents.length
                ? `<div class="doc-list">${docListHtml}</div>`
                : '<p class="status">No documents indexed yet.</p>';

            document.querySelectorAll(".delete-btn").forEach((btn) => {
                btn.addEventListener("click", () => deleteDocument(btn.dataset.filename));
            });
        }

        async function deleteDocument(filename) {
            if (!confirm(`Delete '${filename}' and all its indexed chunks?`)) return;
            const response = await fetch(`/documents/${encodeURIComponent(filename)}`, { method: "DELETE" });
            const data = await response.json();
            if (data.error) {
                uploadStatus.innerHTML = `<span class="error">${data.error}</span>`;
            } else {
                uploadStatus.innerText = data.message;
                refreshDocumentList();
            }
        }

        document.getElementById("uploadBtn").addEventListener("click", async () => {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];
            if (!file) {
                uploadStatus.innerHTML = '<span class="error">Please choose a file first.</span>';
                return;
            }
            const formData = new FormData();
            formData.append("file", file);
            uploadStatus.innerText = "Uploading and indexing...";

            const response = await fetch("/upload", { method: "POST", body: formData });
            const data = await response.json();
            if (data.error) {
                uploadStatus.innerHTML = `<span class="error">${data.error}</span>`;
            } else {
                uploadStatus.innerText = data.message;
                refreshDocumentList();
            }
        });

        // ================= Conversations (sidebar) =================
        async function refreshConversationList() {
            const response = await fetch("/conversations");
            const data = await response.json();

            if (data.conversations.length === 0) {
                // A brand-new user has no conversations yet — create one
                // automatically so there's always something active,
                // rather than showing an empty chat with nothing to click.
                await createConversation();
                return;
            }

            convListContainer.innerHTML = data.conversations.map((c) => `
                <div class="conv-item ${c.id === activeConversationId ? 'active' : ''}" data-id="${c.id}">
                    <span class="conv-title">${c.title}</span>
                    <button class="conv-delete" data-id="${c.id}" title="Delete conversation">✕</button>
                </div>
            `).join("");

            document.querySelectorAll(".conv-item").forEach((el) => {
                el.addEventListener("click", (e) => {
                    // Don't trigger "switch conversation" when the click
                    // was actually on the delete button inside this item.
                    if (e.target.classList.contains("conv-delete")) return;
                    switchConversation(parseInt(el.dataset.id));
                });
            });
            document.querySelectorAll(".conv-delete").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteConversation(parseInt(btn.dataset.id));
                });
            });

            // If nothing is active yet (first load), open the most recent one
            if (activeConversationId === null) {
                switchConversation(data.conversations[0].id);
            }
        }

        async function createConversation() {
            const response = await fetch("/conversations", { method: "POST" });
            const data = await response.json();
            activeConversationId = data.id;
            chatLog.innerHTML = "";
            await refreshConversationList();
        }

        async function switchConversation(id) {
            activeConversationId = id;
            const response = await fetch(`/conversations/${id}/messages`);
            const data = await response.json();

            chatLog.innerHTML = "";
            data.messages.forEach((m) => renderMessage(m.role, m.content, m.sources));

            // Re-render the sidebar so the "active" highlight moves to
            // the newly selected conversation.
            document.querySelectorAll(".conv-item").forEach((el) => {
                el.classList.toggle("active", parseInt(el.dataset.id) === id);
            });
            scrollChatToBottom();
        }

        async function deleteConversation(id) {
            if (!confirm("Delete this conversation and all its messages?")) return;
            await fetch(`/conversations/${id}`, { method: "DELETE" });

            if (id === activeConversationId) {
                activeConversationId = null;
                chatLog.innerHTML = "";
            }
            await refreshConversationList();
        }

        // ================= Chat rendering =================
        function renderMessage(role, content, sources) {
            const div = document.createElement("div");
            div.className = `msg ${role}`;

            let html = `<div class="bubble">${content}</div>`;

            if (role === "assistant" && sources && sources.length > 0) {
                const uniqueSources = [...new Set(sources.map((s) => s.source))];
                const tags = uniqueSources.map((s) => `<span class="source-tag">📄 ${s}</span>`).join("");
                html += `<div class="sources-line"><span class="label">Sources:</span> ${tags}</div>`;
            }

            div.innerHTML = html;
            chatLog.appendChild(div);
        }

        function scrollChatToBottom() {
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // ================= Asking questions =================
        document.getElementById("newChatBtn").addEventListener("click", createConversation);

        document.getElementById("askBtn").addEventListener("click", async () => {
            const question = questionInput.value.trim();
            const source = sourceSelect.value;

            if (!question) return;
            if (!activeConversationId) {
                alert("No active conversation — please wait for one to load, or click 'New Chat'.");
                return;
            }

            renderMessage("user", question, null);
            questionInput.value = "";
            scrollChatToBottom();

            const thinkingDiv = document.createElement("div");
            thinkingDiv.className = "msg assistant";
            thinkingDiv.innerHTML = '<div class="bubble status">Thinking...</div>';
            chatLog.appendChild(thinkingDiv);
            scrollChatToBottom();

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    question: question,
                    source: source,
                    conversation_id: activeConversationId,
                }),
            });
            const data = await response.json();

            chatLog.removeChild(thinkingDiv);

            if (data.error) {
                renderMessage("assistant", data.error, null);
            } else {
                renderMessage("assistant", data.answer, data.retrieved_chunks);
                // The conversation may have just been auto-titled from
                // this first question — refresh the sidebar so the new
                // title shows up without needing a manual reload.
                refreshConversationList();
            }
            scrollChatToBottom();
        });

        questionInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("askBtn").click();
        });

        // ================= Initial load =================
        refreshDocumentList();
        refreshConversationList();
    </script>
</body>
</html>
